name: Validate posts

on:
  push:
    branches:
      - main
      - master
    paths:
      - "_posts/**"
      - "scripts/validate_posts.py"
      - "scripts/test_validate_posts.py"
      - ".github/workflows/validate-posts.yml"
  pull_request:
    paths:
      - "_posts/**"
      - "scripts/validate_posts.py"
      - "scripts/test_validate_posts.py"
      - ".github/workflows/validate-posts.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python scripts/test_validate_posts.py
      - name: Validate published posts
        run: python scripts/validate_posts.py
